name: Build

# Cosa fa:
#   - android: compila l'APK della versione per telefono (su Linux: buildozer
#     non gira su Windows) e lo pubblica come artefatto;
#   - desktop: compila l'eseguibile Windows con PyInstaller;
#   - release: su un tag "v*" allega APK ed EXE a una Release di GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Cache di Buildozer (SDK/NDK e build precedenti)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}

      - name: Installa Buildozer
        run: python -m pip install --upgrade pip buildozer cython

      - name: Sincronizza il core condiviso da desktop/
        run: python tools/sync_core.py

      - name: Prepara firma Android
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/android-release.keystore"
            {
              echo "ANDROID_BUILD_MODE=release"
              echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/android-release.keystore"
              echo "P4A_RELEASE_KEYSTORE_PASSWD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "P4A_RELEASE_KEYALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "P4A_RELEASE_KEYALIAS_PASSWD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            echo "ANDROID_BUILD_MODE=debug" >> "$GITHUB_ENV"
            echo "::warning::Android signing secrets missing: APK will be debug-signed and may not update an existing installation."
          fi

      - name: Compila l'APK
        working-directory: android
        run: buildozer -v android "$ANDROID_BUILD_MODE"

      - name: Prepara artefatto APK
        shell: bash
        run: |
          mkdir -p dist/android
          cp android/bin/*.apk dist/android/ForgeCustomImporter-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: forge-importer-android-apk
          path: dist/android/ForgeCustomImporter-android.apk
          if-no-files-found: error

  desktop:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dipendenze Python
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compila l'eseguibile
        working-directory: desktop
        run: pyinstaller --noconfirm --clean ForgeCustomImporter.spec

      - name: Prepara artefatto EXE
        shell: bash
        run: |
          mkdir -p dist/windows
          cp desktop/dist/ForgeCustomImporter.exe dist/windows/ForgeCustomImporter-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: forge-importer-desktop-exe
          path: dist/windows/ForgeCustomImporter-windows.exe
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/forge-importer-android-apk/ForgeCustomImporter-android.apk
            dist/forge-importer-desktop-exe/ForgeCustomImporter-windows.exe
