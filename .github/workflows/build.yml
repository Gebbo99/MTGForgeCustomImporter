name: Build

# Cosa fa:
#   - desktop: compila l'eseguibile Windows con PyInstaller;
#   - release: su un tag "v*" allega l'EXE a una Release di GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dipendenze Python
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compila l'eseguibile
        working-directory: desktop
        run: pyinstaller --noconfirm --clean ForgeCustomImporter.spec

      - name: Prepara artefatto EXE
        shell: bash
        run: |
          mkdir -p dist/windows
          cp desktop/dist/ForgeCustomImporter.exe dist/windows/ForgeCustomImporter-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: forge-importer-desktop-exe
          path: dist/windows/ForgeCustomImporter-windows.exe
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/forge-importer-desktop-exe/ForgeCustomImporter-windows.exe
